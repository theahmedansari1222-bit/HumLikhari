<!DOCTYPE html>
<!--
  ہم لکھاری — ایپ ڈیزائن v1.0 (اصل پری ویو + کوڈ کی اضافی خصوصیات)
  اصل ڈیزائن کی ہر اسکرین اور رویہ جوں کا توں ہے۔ وہ چیزیں جو کوڈ (hum-likhari-frontend v1.0.0-rc.1) میں پہلے سے موجود تھیں اور
  ڈیزائن میں نہیں تھیں، یہاں شامل کر دی گئی ہیں:
    • سائن اِن کے بغیر پڑھنا اور "سائن اِن ضروری ہے" شیٹ؛ OTP دوبارہ بھیجنے کا کاؤنٹ ڈاؤن؛ "آپ نے ہمارے بارے میں کیسے سنا؟" سروے
    • کور تصویر (اصل اپ لوڈ، تھمب نیل، ہٹانا)؛ تحریر پر تعاون کی سہولت کا احترام؛ اپنی تحریر پر "تعاون کریں" نہیں
    • رپورٹ شیٹ (وجوہات + تفصیل)، بلاک شیٹ، بلاک کیے گئے لوگ، لکھاری کے صفحے پر مزید مینو، تبصروں میں جوابات
    • اکاؤنٹ ڈیلیٹ پر DELETE لکھ کر تصدیق
    • پروفائل: ملک، چھوٹے حروف والا ہینڈل (3–24)، بینک کی تینوں تفصیلات لازمی، "قارئین کو یہ تفصیل دکھائیں" سوئچ، لکھاری بیج
    • تعاون: اپنی مرضی کی رقم (10 سے 10,00,000)، درست الفاظ "بھیجنے کا طریقہ دیکھیں" (ایپ رقم منتقل نہیں کرتی)، اگر لکھاری نے تفصیل نہ دی ہو تو خالی حالت، پیغام، تاریخ میں حالتیں + "رقم موصول ہوئی ✓" / "منسوخ کریں"
    • مدد: پیغام کی قسم، فائل لگانا، "میرے پیغامات" اور ٹکٹ کی گفتگو
    • ہماری ٹیم میں شامل ہوں، لکھاری بیج کی درخواست، پلیٹ فارم کی معاونت (صرف پاکستان، دستی ریکارڈ)
    • اطلاعات کی نئی اقسام (مواد ہٹایا گیا، ٹکٹ کا جواب، ٹیم/بیج/معاونت کی حالت)؛ معطل اکاؤنٹ کی اسکرین؛ لوڈنگ/خرابی/خالی حالتیں
  اسکرین کے نیچے "کوڈ میں شامل اضافی اسکرینیں" کی پٹی سے ان تک براہِ راست پہنچا جا سکتا ہے۔
-->
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ہم لکھاری – ایپ ڈیزائن v1.0</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic:wght@400;600;700&family=Noto+Nastaliq+Urdu:wght@500&display=swap">
<style>
:root{--bg:#e9e9eb;--s:#fff;--s2:#f4f4f5;--ink:#0a0a0a;--mu:#68686e;--ln:#dedee2;--g:#0a0a0a;--gs:#f0f0f1;--on:#fff;--au:#0a0a0a;--aus:#f4f4f5;--hr:#d93025;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#161616;--s:#000;--s2:#121212;--ink:#f4f4f5;--mu:#9b9ba1;--ln:#262628;--g:#fff;--gs:#1c1c1e;--on:#000;--au:#fff;--aus:#161618;--hr:#ff6b5e;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#161616;--s:#000;--s2:#121212;--ink:#f4f4f5;--mu:#9b9ba1;--ln:#262628;--g:#fff;--gs:#1c1c1e;--on:#000;--au:#fff;--aus:#161618;--hr:#ff6b5e;color-scheme:dark}
:root[data-theme="cream"]{--bg:#e6dcc3;--s:#f7f0e0;--s2:#efe5cd;--ink:#2b2418;--mu:#6f634d;--ln:#e2d6ba;--g:#5a4630;--gs:#eadfc5;--on:#fff;--au:#5a4630;--aus:#eadfc5;--hr:#d93025;color-scheme:light}
:root[data-theme="green"]{--bg:#d9e6dc;--s:#f1f7f2;--s2:#e3eee5;--ink:#12261a;--mu:#56705e;--ln:#d3e1d6;--g:#1f6b3a;--gs:#dcebdf;--on:#fff;--au:#1f6b3a;--aus:#dcebdf;--hr:#d93025;color-scheme:light}
:root[data-theme="yellow"]{--bg:#efe3a8;--s:#fdf7d8;--s2:#f7edb5;--ink:#2a2406;--mu:#6e6428;--ln:#ebdf9c;--g:#8a6500;--gs:#f5e9a8;--on:#fff;--au:#8a6500;--aus:#f5e9a8;--hr:#d93025;color-scheme:light}
:root[data-theme="blue"]{--bg:#d3e1f5;--s:#f0f6fe;--s2:#e1ecfa;--ink:#0f1e36;--mu:#566b88;--ln:#d1def2;--g:#1a56c4;--gs:#dbe7fa;--on:#fff;--au:#1a56c4;--aus:#dbe7fa;--hr:#d93025;color-scheme:light}
:root[data-theme="pink"]{--bg:#f1d5df;--s:#fff1f5;--s2:#fbe1ea;--ink:#35101f;--mu:#845466;--ln:#f4d3df;--g:#c2185b;--gs:#fadce7;--on:#fff;--au:#c2185b;--aus:#fadce7;--hr:#d93025;color-scheme:light}
:root[data-theme="orange"]{--bg:#f3dcc4;--s:#fff4e8;--s2:#fde5cf;--ink:#341a07;--mu:#85603f;--ln:#f4dcc3;--g:#c2500a;--gs:#fbdfc6;--on:#fff;--au:#c2500a;--aus:#fbdfc6;--hr:#d93025;color-scheme:light}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.8 "Noto Naskh Arabic",system-ui,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--au);outline-offset:2px}
.stage{height:100%;display:flex;flex-direction:column;align-items:center;gap:10px;padding:10px}
.phone{position:relative;flex:1;min-height:0;width:min(100%,390px);max-height:820px;background:var(--s);border-radius:34px;overflow:hidden;box-shadow:0 0 0 7px #1a1a1a,0 20px 50px rgba(0,0,0,.25)}
.screen{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden}
.tb .screen{bottom:62px}
.tabbar{display:none;position:absolute;inset:auto 0 0 0;height:62px;background:var(--s);border-top:1px solid var(--ln);align-items:center;justify-content:space-around}
.tb .tabbar{display:flex}
.tabbar button{display:flex;flex-direction:column;align-items:center;font-size:11px;line-height:1.3;color:var(--mu);gap:1px}
.tabbar button.on{color:var(--g);font-weight:700}
.tabbar svg{display:block}
.tabbar button{position:relative}.tabbar .bd{position:absolute;top:-3px;left:50%;margin-left:6px;min-width:16px;height:16px;padding:0 4px;border-radius:99px;background:var(--hr);color:#fff;font-size:10px;line-height:16px;text-align:center}
.tabbar .plus{width:44px;height:44px;border-radius:50%;background:var(--g);color:var(--on);display:grid;place-items:center}
.toast{position:absolute;bottom:76px;left:50%;transform:translate(-50%,16px);background:var(--ink);color:var(--s);padding:4px 16px;border-radius:99px;font-size:13px;opacity:0;pointer-events:none;transition:.2s;white-space:nowrap;z-index:30}
.toast.show{opacity:1;transform:translate(-50%,0)}
#sheet{display:none;position:absolute;inset:0;z-index:20}
#sheet.on{display:flex;flex-direction:column;justify-content:flex-end}
.sb{position:absolute;inset:0;background:#0007}
.sh{position:relative;background:var(--s);border-radius:22px 22px 0 0;padding:18px 18px 22px;max-height:88%;overflow-y:auto}
.pad{padding:12px 16px}.mu{color:var(--mu)}.hl{font-family:"Noto Nastaliq Urdu","Noto Naskh Arabic",serif;font-weight:500;line-height:2.1;margin:0}
.hdr{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px;border-bottom:1px solid var(--ln);position:sticky;top:0;background:var(--s);z-index:3}
.hdr h2{margin:0;font-size:17px}.rt{display:flex;min-width:34px;align-items:center;gap:2px}
.ic{width:34px;height:34px;display:grid;place-items:center;border-radius:50%}
.logo{font:700 21px/1.5 "Noto Naskh Arabic",system-ui,sans-serif;color:var(--ink)}
.btn{display:block;width:100%;padding:7px;border-radius:14px;background:var(--g);color:var(--on);font-weight:700;font-size:16px;text-align:center}
.btn.o{background:none;color:var(--g);border:1.5px solid var(--g)}.btn.au{background:var(--au);color:var(--on)}.btn.rd{background:var(--hr)}
.lnk{color:var(--g);font-weight:600;padding:4px 8px}
.pill{background:var(--g);color:var(--on);padding:0 16px;border-radius:99px;font-weight:700;font-size:14px}
.search{display:flex;align-items:center;gap:8px;background:var(--s2);border-radius:14px;padding:4px 12px;color:var(--mu)}
.search input{flex:1;background:none;border:0;outline:0;min-width:0}
.cats{display:flex;gap:8px;overflow-x:auto;padding:10px 16px}
.cats button{white-space:nowrap;padding:0 14px;border-radius:99px;background:var(--s2);color:var(--mu);font-size:14px}
.cats button.on{background:var(--g);color:var(--on);font-weight:700}
.card{margin:0 12px 12px;padding:12px;border:1px solid var(--ln);border-radius:16px}
.who{display:flex;align-items:center;gap:10px}.who b{display:block;line-height:1.4}.who small{color:var(--mu);font-size:12px}
.av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:17px;flex:none}
.card h3{font-size:17px;margin:4px 0 0;cursor:pointer}.card p{margin:0 0 8px;color:var(--mu);font-size:14px}
.art{position:relative;border-radius:12px;overflow:hidden}.art svg{position:absolute;inset:0;width:100%;height:100%;opacity:.2}
.poem{margin:6px 0;padding:10px;background:var(--s2);border-radius:12px;text-align:center;font-family:"Noto Nastaliq Urdu",serif;line-height:2.2;cursor:pointer}
.acts{display:flex;align-items:center;gap:18px;margin-top:8px;font-size:13px;color:var(--mu)}
.acts button{display:inline-flex;align-items:center;gap:5px;color:var(--mu)}.acts button.on{color:var(--hr)}.acts .sv.on{color:var(--g)}.acts .end{margin-inline-start:auto}
.fld{width:100%;border:1px solid var(--ln);border-radius:12px;background:var(--s);padding:6px 12px;outline:0}.fld.bad{border-color:var(--hr)}
.tools{display:flex;direction:ltr;justify-content:space-around;margin:10px 0;padding:6px;border:1px solid var(--ln);border-radius:12px;font:700 15px system-ui}
.tools span{display:inline-flex}
.row{display:flex;align-items:center;gap:12px;padding:8px 12px;border:1px solid var(--ln);border-radius:12px;margin-bottom:8px;width:100%}
.row select{margin-inline-start:auto;background:var(--s);border:0}.row svg{color:var(--mu);flex:none}
.sw{margin-inline-start:auto;width:44px;height:25px;border-radius:99px;background:var(--ln);position:relative;transition:.2s;direction:ltr;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:19px;height:19px;border-radius:50%;background:#fff;transition:.2s}
.sw.on{background:var(--g)}.sw.on::after{left:22px;background:var(--on)}
.stats{display:flex;justify-content:space-around;text-align:center;margin:10px 0}.stats b{display:block;font-size:20px;line-height:1.3}.stats span{color:var(--mu);font-size:13px}
.tabs{display:flex;border-bottom:1px solid var(--ln)}.tabs button{flex:1;padding:4px;color:var(--mu)}.tabs button.on{color:var(--g);font-weight:700;box-shadow:inset 0 -3px 0 var(--g)}
.li{display:flex;gap:12px;padding:10px 16px;align-items:center;cursor:pointer}.li .art{width:72px;height:58px;flex:none}.li b{display:block;line-height:1.6}.li small{color:var(--mu)}
.empty{text-align:center;color:var(--mu);padding:28px 20px}
.mrow{display:flex;align-items:center;gap:14px;padding:10px 18px;width:100%;border-bottom:1px solid var(--ln)}.mrow svg{color:var(--g)}.mrow.rd,.mrow.rd svg{color:var(--hr)}
.splash{min-height:100%;display:flex;flex-direction:column;align-items:center;text-align:center;padding:24px;background:var(--s)}
.nq{font-family:"Noto Nastaliq Urdu",serif;line-height:2.2;font-size:22px;margin:10px 0 2px}
.fol{margin-inline-start:auto;padding:0 16px;border-radius:99px;border:1.5px solid var(--g);color:var(--g);font-weight:700;font-size:14px}.fol.on{background:var(--gs);border-color:transparent}
.rp{display:flex;gap:8px;align-items:center;padding:8px 16px;background:var(--s2);font-size:14px;flex-wrap:wrap}.rp button{padding:0 12px;border-radius:99px;border:1px solid var(--ln);background:var(--s)}
.body p{margin:0 0 12px}.cpl{text-align:center;font-family:"Noto Nastaliq Urdu",serif;line-height:2.4;margin:0 0 14px}
.sup{margin-top:18px;padding:14px;border-radius:16px;background:var(--aus);text-align:center}.sup p{margin:0 0 8px}
.bar{position:sticky;bottom:0;background:var(--s);border-top:1px solid var(--ln);padding:6px 16px}.bar .acts{margin:0;justify-content:space-between}
.cm{padding:10px 16px;border-bottom:1px solid var(--ln)}.cm b{display:block}
.cin{position:sticky;bottom:0;display:flex;gap:8px;padding:8px 12px;background:var(--s);border-top:1px solid var(--ln)}.cin input{flex:1}
.amts{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.amts button{padding:0 14px;border-radius:99px;border:1.5px solid var(--ln)}.amts button.on{border-color:var(--au);background:var(--aus);font-weight:700}
.qr{text-align:center;margin:8px 0}
#off{display:none;position:absolute;left:0;right:0;bottom:62px;z-index:15;background:var(--ink);color:var(--s);padding:4px 16px;font-size:13px;align-items:center;justify-content:space-between}#off.on{display:flex}.phone:not(.tb) #off{bottom:0}
.tools button{padding:0 18px}
.lg{display:inline-flex;align-items:center;justify-content:center;min-width:56px;height:26px;padding:0 8px;border-radius:7px;color:#fff;font:800 11px system-ui,sans-serif;direction:ltr;flex:none}
.pm{display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;border:1.5px solid var(--ln);border-radius:12px;margin-top:8px}.pm.on{border-color:var(--au);background:var(--aus)}.pm[disabled]{opacity:.5;cursor:default}
.pd{padding:4px 12px 6px;border:1.5px solid var(--ln);border-top:0;border-radius:0 0 12px 12px;margin-top:-6px}.dv{display:flex;align-items:center;gap:8px;padding:4px 0;border-bottom:1px solid var(--ln)}.dv:last-child{border:0}.dv span{min-width:92px;font-size:13px}.dv b{flex:1;font-weight:600;word-break:break-all;unicode-bidi:plaintext;text-align:start}.qr svg{background:#fff;padding:8px;border-radius:12px;width:160px;height:160px}
@media(max-width:480px){.stage{padding:0}.phone{width:100%;max-height:none;border-radius:0;box-shadow:none}}
.brand{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding-top:56px}
.wm{font:700 50px/1.5 "Noto Naskh Arabic",system-ui,sans-serif;color:var(--ink)}
.wl{font:600 12px/1 system-ui,sans-serif;letter-spacing:.34em;padding-inline-start:.34em;color:var(--mu);direction:ltr}
.go{width:100%;display:grid;gap:10px}
.go .btn{display:flex;align-items:center;justify-content:center;gap:10px;padding:12px}
.go .btn.o{border-color:var(--ln);color:var(--ink)}
.gi{width:26px;height:26px;border-radius:50%;background:#fff;display:grid;place-items:center}
.thm{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding:6px 18px 16px;border-bottom:1px solid var(--ln)}
.thm button{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:13px;color:var(--mu)}
.thm i{width:100%;aspect-ratio:1.25;border-radius:14px;border:1.5px solid var(--ln);display:grid;place-items:center}
.thm i b{width:20px;height:20px;border-radius:50%}
.thm button.on{color:var(--ink);font-weight:700}
.thm button.on i{border-color:var(--g);box-shadow:0 0 0 2px var(--g)}
.avw{position:relative;display:inline-block;border-radius:50%}
.cam{position:absolute;bottom:0;inset-inline-end:0;width:34px;height:34px;border-radius:50%;background:var(--g);color:var(--on);border:3px solid var(--s);display:grid;place-items:center}
.cw{position:relative;width:min(100%,320px);aspect-ratio:1;margin:4px auto 0;border-radius:16px;overflow:hidden;background:#000}
.cw canvas{display:block;width:100%;height:100%;cursor:grab;touch-action:none}
.cmk{position:absolute;inset:0;pointer-events:none}
.cmk::after{content:"";position:absolute;inset:0;border-radius:50%;box-shadow:0 0 0 999px rgba(0,0,0,.55);border:2px solid #fff}
.crow{display:flex;align-items:center;gap:10px;margin:12px 0}.crow input{flex:1;accent-color:var(--g)}

/* ---- v1.0 additions (from the implemented code) ---- */
.ltr{direction:ltr;text-align:left}
.fld[disabled],.btn[disabled]{opacity:.5;cursor:default}
select.fld{appearance:auto}
.lbl{display:block;margin-top:10px}.hint{font-size:12px;margin-top:2px}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--ln);border-top-color:var(--g);border-radius:50%;vertical-align:middle;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.spin{animation:none}}
.notice{margin:10px 0;padding:10px 12px;border-radius:12px;background:var(--s2);border:1px solid var(--ln);font-size:14px}
.notice.bad{border-color:var(--hr);color:var(--hr)}
.chip{display:inline-flex;align-items:center;gap:4px;padding:0 10px;border-radius:99px;background:var(--s2);color:var(--mu);font-size:12px;line-height:22px;white-space:nowrap}
.chip.ok{background:var(--aus);color:var(--g)}.chip.bad{color:var(--hr)}
.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:6px 0}
.cats.wrap{flex-wrap:wrap}
.art img{width:100%;height:100%;object-fit:cover;display:block}
.thumb{width:56px;height:40px;object-fit:cover;border-radius:8px}
.bub{margin:8px 16px;padding:8px 12px;border-radius:14px;max-width:85%}
.bub.me{background:var(--aus);margin-inline-start:auto}.bub.them{background:var(--s2);margin-inline-end:auto}
.bub small{display:block;color:var(--mu);font-size:11px}
.acc{margin:10px 0;padding:10px 12px;border:1.5px solid var(--ln);border-radius:12px}
.li small.note{display:block;color:var(--mu)}
.cm.rep{margin-inline-start:28px;border-inline-start:2px solid var(--ln)}
.row{display:flex;align-items:center;gap:10px;width:100%;text-align:start}
.dev{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;align-items:center;max-width:820px;font-size:12px;line-height:1.5}
.dev b{color:var(--mu);font-weight:600}.dev button{padding:2px 10px;border:1px solid var(--ln);border-radius:99px;background:var(--s)}.dev button:hover{border-color:var(--g)}
@media(max-width:480px){.dev{display:none}}
</style>
</head>
<body>
<div class="stage">
  
  <div class="phone" id="phone">
    <div class="screen" id="screen"></div>
    <nav class="tabbar" id="tabbar"></nav>
    <div id="off" role="alert"><span>انٹرنیٹ نہیں ہے</span><button class="lnk" style="color:#ffd23f;padding:0" data-retry>دوبارہ کوشش</button></div>
    <div id="sheet"></div>
    <div class="toast" id="toast" role="status"></div>
  </div>
  <nav class="dev" id="dev" aria-label="کوڈ میں شامل اضافی اسکرینیں"></nav>
</div>

R.badges=()=>{const pend=t=>S.bapp.some(a=>a.t==t&&["received","in_review"].includes(a.st)),ch=BADGET.filter(b=>!S.bact.includes(b[0])&&!pend(b[0])),sel=ch.some(b=>b[0]==S.fx["bd.type"])?S.fx["bd.type"]:(ch[0]&&ch[0][0])||"";
return `${hd("لکھاری بیج")}<div class="pad"><p class="mu">بیج آپ کے پروفائل پر نظر آتا ہے۔ درخواست کا فیصلہ ہماری ٹیم کرتی ہے۔</p>${S.bact.length?`<div class="chips" style="justify-content:flex-start">${S.bact.map(bchip).join("")}</div>`:""}${ch.length?`<div class="cats wrap" style="padding-inline:0">${ch.map(b=>`<button data-x="bd" data-v="${b[0]}" class="${sel==b[0]?"on":""}" aria-pressed="${sel==b[0]}">${b[1]}</button>`).join("")}</div><div class="mu hint">${BADGEH[sel]||""}</div><label class="mu lbl">اپنے کام کے بارے میں (اختیاری)</label><textarea class="fld" data-fx="bd.note" rows="3" maxlength="2000" placeholder="اپنی بہترین تحریروں کا ذکر کریں" aria-label="نوٹ">${esc(fxv("bd.note",""))}</textarea><button class="btn" style="margin-top:10px" data-x="bds">درخواست بھیجیں</button>`:`<div class="notice">اس وقت کوئی نئی درخواست ممکن نہیں۔</div>`}</div><div class="pad" style="padding-bottom:0"><b>میری درخواستیں</b></div>${S.bapp.map(a=>`<div class="li" style="cursor:default;flex-wrap:wrap"><div style="flex:1"><b>${lab(BADGET,a.t)}</b><small>${a.tm}</small></div>${chip(STX.badge[a.st],tone(a.st))}</div>`).join("")||'<div class="empty">ابھی کوئی درخواست نہیں۔</div>'}`};
R.platform=()=>{const pk=S.me.c=="PK",m=fxv("pf.method",PFA[0].m);return `${hd("پلیٹ فارم کی معاونت")}<div class="pad"><p class="mu">ہم لکھاری کو چلانے میں مدد کے لیے نیچے دیے گئے اکاؤنٹ میں رقم بھیجیں، پھر یہاں اطلاع درج کریں۔ ٹیم تصدیق کے بعد آپ کو بتائے گی۔ فی الحال یہ سہولت صرف پاکستان کے لیے ہے۔</p>
${!pk?`<div class="notice">اس سہولت کے لیے پروفائل میں ملک “پاکستان” منتخب ہونا ضروری ہے۔ <button class="lnk" data-ep>پروفائل ایڈٹ کریں</button></div>`:`${PFA.map(a=>`<div class="acc"><div class="row" style="border:0;margin:0;padding:0">${lgm(a.m)}<b>${a.label||METH[a.m]}</b></div>${[["بینک",a.bank],["اکاؤنٹ ٹائٹل",a.title],["اکاؤنٹ نمبر / IBAN",a.id]].filter(r=>r[1]).map(r=>`<div class="dv"><span class="mu">${r[0]}</span><b>${esc(r[1])}</b><button class="lnk" data-cpy="${esc(r[1])}">کاپی</button></div>`).join("")}${a.ins?`<div class="mu" style="font-size:13px">${a.ins}</div>`:""}</div>`).join("")}<div class="mu" style="font-size:11px">ڈیزائن میں نمونہ اکاؤنٹ؛ اصل اکاؤنٹ admin کنسول کے "معاونت کے اکاؤنٹس" سیکشن میں درج ہوتے ہیں۔</div>
<b style="display:block;margin-top:14px">رقم بھیجنے کے بعد اطلاع دیں</b><label class="mu lbl">رقم (روپے، کم از کم 100)</label><input class="fld ltr" data-fx="pf.amount" value="${esc(fxv("pf.amount",""))}" inputmode="numeric" maxlength="7" aria-label="رقم"><label class="mu lbl">طریقہ</label><select class="fld" data-fx="pf.method" aria-label="طریقہ">${opts(PFA.map(a=>[a.m,METH[a.m]]),m)}</select><label class="mu lbl">ٹرانزیکشن نمبر (اختیاری)</label><input class="fld ltr" data-fx="pf.ref" value="${esc(fxv("pf.ref",""))}" maxlength="120" aria-label="ٹرانزیکشن نمبر"><label class="mu lbl">پیغام (اختیاری)</label><textarea class="fld" data-fx="pf.note" rows="2" maxlength="1000" aria-label="پیغام">${esc(fxv("pf.note",""))}</textarea><button class="btn" style="margin-top:10px" data-x="pfs">اطلاع بھیجیں</button>`}</div><div class="pad" style="padding-bottom:0"><b>میری اطلاعات</b></div>${S.pf.map(d=>`<div class="li" style="cursor:default;flex-wrap:wrap"><div style="flex:1"><b>${d.amt} روپے</b><small>${METH[d.m]} · ${d.tm}</small>${d.note?`<small class="note">ٹیم کا جواب: ${esc(d.note)}</small>`:""}</div>${chip(STX.pf[d.st],tone(d.st))}</div>`).join("")||'<div class="empty">ابھی کوئی اطلاع نہیں۔</div>'}`};
R.history=()=>{const t=S.ht,l=t?S.dh.map((x,i)=>({n:x.to,a:x.amt,tm:x.tm,s:x.st||"s",i,note:x.note})):RC.map((x,i)=>({n:x[0],a:x[1],tm:x[2],s:x[3]||"s",i})),tot=l.filter(x=>x.s!="c").reduce((q,x)=>q+x.a,0);
return `${hd("تعاون کی تاریخ")}<div class="tabs">${["موصول","بھیجے گئے"].map((x,i)=>`<button data-ht="${i}" class="${i==t?"on":""}">${x}</button>`).join("")}</div><div class="pad"><span class="mu">کل درج شدہ رقم</span><b style="display:block;font-size:22px">${tot} روپے</b></div>${l.map(x=>`<div class="li" style="cursor:default;flex-wrap:wrap">${av(x.n)}<div style="flex:1"><b>${x.n}</b><small>${x.tm}</small>${x.note?`<small class="note">«${esc(x.note)}»</small>`:""}</div><b style="margin-inline-start:auto">${x.a} روپے</b><div style="width:100%;display:flex;gap:8px;align-items:center;margin-top:2px">${chip(CLS[x.s][0],CLS[x.s][1])}${!t&&x.s=="s"?`<button class="lnk" data-x="ack" data-v="${x.i}">رقم موصول ہوئی ✓</button>`:""}${t&&x.s=="s"?`<button class="lnk" data-x="cnl" data-v="${x.i}" style="color:var(--hr)">منسوخ کریں</button>`:""}</div></div>`).join("")||'<div class="empty">ابھی کوئی ریکارڈ نہیں۔</div>'}<div class="pad mu" style="font-size:12px">رقم لکھاری کے اپنے اکاؤنٹ میں جاتی ہے۔ ایپ صرف وہی ریکارڈ دکھاتی ہے جو بھیجنے والے نے “میں نے رقم بھیج دی” سے درج کیا ہو۔ لکھاری وصولی کی تصدیق کر سکتا ہے۔</div>`};
R.help=()=>`${hd("مدد اور رابطہ")}${FAQ.map((f,i)=>`<button class="mrow" data-fq="${i}" style="flex-wrap:wrap"><b style="flex:1;text-align:start">${f[0]}</b>${ic(S.fq===i?"down":"chev",16)}${S.fq===i?`<div class="mu" style="width:100%;text-align:start;font-size:14px">${f[1]}</div>`:""}</button>`).join("")}<div class="pad"><b>ہم سے رابطہ کریں</b><select class="fld" data-fx="help.type" aria-label="پیغام کی قسم" style="margin-top:6px">${opts(FBT,fxv("help.type","question"))}</select><textarea class="fld" id="hm" rows="4" maxlength="5000" style="margin-top:6px" placeholder="اپنا مسئلہ یا تجویز لکھیں…" aria-label="پیغام">${esc(S.hm)}</textarea>${S.hf?`<div class="row" style="margin-top:6px">${ic("doc",18)}<span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis">${esc(S.hf)}</span><button class="lnk" data-x="hfx" style="color:var(--hr)">ہٹائیں</button></div>`:`<label class="row" style="margin-top:6px;cursor:pointer"><input type="file" accept="image/jpeg,image/png,image/webp,application/pdf" data-hf hidden>${ic("image",18)} اسکرین شاٹ یا PDF لگائیں (اختیاری)</label>`}<button class="btn" style="margin-top:8px" data-hsend>پیغام بھیجیں</button></div><div class="pad" style="padding-bottom:0"><b>میرے پیغامات</b></div>${S.tk.map(t=>`<button class="li" data-x="tk" data-v="${t.id}" style="width:100%;text-align:start"><div style="flex:1"><b>${esc(t.msg.slice(0,60))}</b><small>#${t.n} · ${lab(FBT,t.type)} · ${t.tm}</small></div>${chip(STX.ticket[t.st],tone(t.st))}</button>`).join("")||'<div class="empty">آپ نے ابھی کوئی پیغام نہیں بھیجا۔</div>'}`;
R.ticket=()=>{const t=S.tk.find(x=>x.id==S.tkid)||S.tk[0];if(!t)return hd("پیغام");const b=[["me","آپ",t.msg,t.tm],...t.th.map(m=>[m[0],m[0]=="me"?"آپ":"ہم لکھاری ٹیم",m[1],m[2]])];
return `${hd("پیغام")}<div class="pad">${chip(STX.ticket[t.st],tone(t.st))} <small class="mu">#${t.n} · ${lab(FBT,t.type)}</small></div>${b.map(x=>`<div class="bub ${x[0]=="me"?"me":"them"}"><div>${esc(x[2])}</div><small>${x[1]} · ${x[3]}</small></div>`).join("")}${t.st=="closed"?`<div class="pad mu">یہ پیغام بند ہو چکا ہے۔ نیا مسئلہ ہو تو نیا پیغام بھیجیں۔</div>`:`<div class="cin"><input class="fld" id="tin" value="" maxlength="4000" placeholder="جواب لکھیں…" aria-label="جواب"><button class="ic" data-x="tks" aria-label="بھیجیں" style="color:var(--g)">${ic("send")}</button></div>`}`};
R.suspended=()=>`<div class="splash"><div class="brand"><div class="wm">ہم لکھاری</div></div><div class="notice bad" role="alert">آپ کا اکاؤنٹ فی الحال معطل ہے۔ اگر آپ سمجھتے ہیں کہ یہ غلطی ہے تو ہم سے رابطہ کریں۔</div><div class="go"><button class="btn o" data-x="logout">${ic("out")}لاگ آؤٹ</button></div></div>`;
R.states=()=>`${hd("حالتیں: لوڈنگ، خرابی، خالی")}<div class="pad"><b>لوڈ ہو رہا ہے</b></div><div class="empty" role="status"><span class="spin" aria-hidden="true"></span> لوڈ ہو رہا ہے…</div><div class="pad"><b>خرابی اور دوبارہ کوشش</b></div><div class="empty" role="alert">انٹرنیٹ یا سرور سے رابطہ نہیں ہو سکا۔<br><button class="lnk" data-toast="دوبارہ کوشش ہو رہی ہے">دوبارہ کوشش کریں</button></div><div class="pad"><b>خالی فہرست</b></div><div class="empty">آپ نے ابھی کوئی پیغام نہیں بھیجا۔</div><div class="pad"><b>غلطی کا نوٹس</b></div><div class="pad"><div class="notice bad" role="alert">رقم 10 سے 10,00,000 روپے کے درمیان ہونی چاہیے۔</div><b>معلوماتی نوٹس</b><div class="notice">آپ کی ایک درخواست پہلے سے زیرِ جائزہ ہے۔</div></div>`;

/* ===== v1.0: sheets ===== */
SH.signin=()=>`<h3 class="hl" style="font-size:19px">سائن اِن ضروری ہے</h3><p class="mu">${S.sig||"یہ کام کرنے"} کے لیے پہلے سائن اِن کریں۔</p><button class="btn" data-x="sg">سائن اِن کریں</button><button class="lnk" style="width:100%;margin-top:4px" data-close>منسوخ</button>`;
SH.report=()=>{const r=S.rep||{t:"post",r:"",d:"",e:""};return `<h3 class="hl" style="font-size:19px">${r.t=="post"?"تحریر رپورٹ کریں":r.t=="comment"?"تبصرہ رپورٹ کریں":"لکھاری کو رپورٹ کریں"}</h3><div class="mu">وجہ منتخب کریں:</div><div class="cats wrap" style="padding-inline:0">${REASONS.map(x=>`<button data-x="rr" data-v="${x[0]}" class="${r.r==x[0]?"on":""}" aria-pressed="${r.r==x[0]}">${x[1]}</button>`).join("")}</div><textarea class="fld" data-rd rows="3" maxlength="2000" placeholder="مزید تفصیل (اختیاری)" aria-label="تفصیل">${esc(r.d)}</textarea>${r.e?`<div class="notice bad" role="alert">${r.e}</div>`:""}<button class="btn rd" style="margin-top:10px" data-x="rsend">رپورٹ بھیجیں</button><button class="lnk" style="width:100%;margin-top:4px" data-close>منسوخ</button>`};
SH.block=()=>{const n=S.bt;return `<h3 class="hl" style="font-size:19px">لکھاری کو بلاک کریں؟</h3><p class="mu">${n?esc(n)+" کی تحریریں آپ کو نظر نہیں آئیں گی اور وہ آپ کی تحریروں پر تبصرہ یا تعاون نہیں کر سکیں گے۔ فالو بھی ختم ہو جائے گا۔":"اس لکھاری کی تحریریں آپ کو نظر نہیں آئیں گی اور فالو ختم ہو جائے گا۔"}</p><button class="btn rd" data-x="blkdo">بلاک کریں</button><button class="lnk" style="width:100%;margin-top:4px" data-close>منسوخ</button>`};
SH.removed=()=>`<h3 class="hl" style="font-size:19px">مواد ہٹا دیا گیا</h3><p class="mu">آپ کا ایک مواد کمیونٹی اصولوں کی خلاف ورزی کی وجہ سے ہٹایا گیا ہے۔ اگر آپ کو لگتا ہے کہ غلطی ہوئی ہے تو مدد اور رابطہ میں ہمیں لکھیں۔</p><button class="btn" data-close>ٹھیک ہے</button>`;
SH.amore=()=>{const n=S.au,b=S.bl[n];return `<button class="mrow" data-close data-toast="پروفائل کا لنک کاپی ہو گیا" style="padding-inline:4px">${ic("link")}پروفائل کا لنک کاپی کریں</button><button class="mrow" data-x="rep" data-v="user" style="padding-inline:4px">${ic("flag")}لکھاری کو رپورٹ کریں</button>${b?`<button class="mrow" data-x="unb" data-v="${esc(n)}" style="padding-inline:4px">${ic("block")}ان بلاک کریں</button>`:`<button class="mrow" data-x="blk" data-v="${esc(n)}" style="padding-inline:4px">${ic("block")}لکھاری کو بلاک کریں</button>`}`};
